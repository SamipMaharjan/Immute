version: "3.8"
services:
  nextjs:
    build: .
    ports:
      - "3100:3100"
    volumes:
      - type: bind
        source: .
        target: /app
      - /app/node_modules
      - /app/.next
    environment:
      - PORT=3100
    command: >
      sh -c "
        npm install &&
        npm run build &&
        npx serve@latest out
      "
